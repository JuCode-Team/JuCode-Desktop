name: Release

# Build and publish a GitHub Release with installers for macOS, Linux and
# Windows whenever a version tag (e.g. v0.1.0a) is pushed.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (arm64)
            target: aarch64-apple-darwin
          - os: ubuntu-22.04 # Linux x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest # Windows x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential file libssl-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The app ships the jucode CLI release named in src-tauri/jucode-cli.version
      # (a sidecar, see src-tauri/src/app_cli.rs and tauri.bundle.conf.json).
      - name: Bundle the jucode CLI
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < src-tauri/jucode-cli.version)"
          ext=""; [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && ext=".exe"
          name="jucode-${{ matrix.target }}${ext}"
          mkdir -p src-tauri/binaries
          curl -fsSL --retry 3 -o "src-tauri/binaries/${name}" \
            "https://github.com/JuCode-Team/JuCode-CLI/releases/download/v${version}/${name}"
          chmod +x "src-tauri/binaries/${name}"
          reported="$("src-tauri/binaries/${name}" --version | awk '{print $NF}' | tr -d '\r')"
          [ "$reported" = "$version" ] || { echo "::error::bundled jucode reports $reported, expected $version"; exit 1; }
          curl -fsSL --retry 3 -o static/jucode-cli-third-party-notices.txt \
            "https://github.com/JuCode-Team/JuCode-CLI/releases/download/v${version}/jucode-third-party-notices.txt"

      # tauri-action runs beforeBuildCommand (pnpm build), bundles the app with
      # the jucode sidecar and uploads the installers to a release named after
      # the tag.
      #
      # Auto-update: with TAURI_SIGNING_PRIVATE_KEY set (repo secret) and
      # bundle.createUpdaterArtifacts enabled in tauri.conf.json, tauri-action
      # additionally signs the updater bundles (.sig files) and generates +
      # uploads latest.json, which installed clients poll via the endpoint in
      # plugins.updater. Key generation & setup: see docs/updater.md.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.bundle.conf.json
          releaseBody: |
            The beta builds are not code-signed yet. To open them the first
            time and grant their permissions, see the install guide:
            https://github.com/JuCode-Team/JuCode-Desktop/blob/main/docs/install.md
