# Standalone workspace so the desktop app stays out of the CLI's cargo workspace.
[workspace]

[package]
name = "desktop"
version = "0.3.2"
description = "JuCode desktop GUI"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
ureq = { version = "2", features = ["json"] }
# auth.json 凭据静态加密（见 docs/secrets.md）。纯 Rust、无 C 依赖，
# default-features 关掉以免多带一份 std/stream 支持。
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
getrandom = "0.2"
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-clipboard-manager = "2"

# 仅桌面端的插件（updater / 单实例 / 进程重启）
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# macOS 侧栏磨砂（NSVisualEffectView）。macOSPrivateApi 在 tauri.conf.json 里对所有平台开启
# （非 macOS 上不起作用），和共用依赖里的 macos-private-api feature 保持一致：tauri dev 会按
# 配置自动改写 feature，两边只在 macOS 开时，它会把 feature 写进共用依赖，导致 Linux/Windows
# 构建报错。透明窗口仍只在 tauri.macos.conf.json 里开启。
[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.5"
